<div class="login-container" style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
  <h2>🔐 Connexion Marketplace</h2>
  
  <form (ngSubmit)="onLogin()">
    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px;">Nom d'utilisateur:</label>
      <input [(ngModel)]="username" name="username" required 
             style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
    </div>
    
    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px;">Mot de passe:</label>
      <input [(ngModel)]="password" type="password" name="password" required
             style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
    </div>
    
    <button type="submit" [disabled]="loading" 
            style="width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
      {{ loading ? 'Connexion...' : 'Se connecter' }}
    </button>
  </form>

  <div *ngIf="message" style="margin-top: 15px; padding: 10px; border-radius: 4px; background: #f8f9fa;">
    {{ message }}
  </div>

  <div style="margin-top: 20px; text-align: center;">
    <p>Pas de compte? <a routerLink="/register">Créer un compte</a></p>
  </div>
</div>
